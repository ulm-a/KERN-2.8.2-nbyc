        g.punkte.map(function (k) {

            (k.id === jetzt ? ' aria-current="page"' : "") + '>' + e(feld(k, "name")) + '</a></li>';
        }).join("") + '</ul></div>';
    }).join("");
  }

  /* --- Steckbrief: Klasse, Namen, Synonyme, Abweichungen (M70) ------- */
  function einmal(liste) {
    return liste.filter(function (x, i) { return x && liste.indexOf(x) === i; });
  }
  function zeile(schluessel, wert) {
    return '<div class="kern-description-list-item"><dt class="kern-description-list-item__key">' + schluessel +
      '</dt><dd class="kern-description-list-item__value">' + wert + '</dd></div>';
  }
  function steckbrief(k) {
    var n = namenVon(k);
    if (!n.length) {
      return k.synonyme && k.synonyme.length ? '<p class="kt__hinweis">' + e(T("auchGenannt")) + ': ' + e(k.synonyme.join(", ")) + '</p>' : "";
    }
    var codes = n.map(function (x) { return x.code; });
    var namen = einmal(n.map(function (x) { return x.de; }).concat(n.map(function (x) { return x.en; }), [k.name]));
    var syn = einmal((k.synonyme || []).concat.apply(k.synonyme || [], n.map(function (x) { return x.synonyme; })))
      .filter(function (s) { return namen.indexOf(s) === -1; });
    var vonKern = codes.filter(function (c) { return c.indexOf("kern-") === 0; });
    var abw;
    if (!vonKern.length) {
      abw = e(T("abwKeine"));
    } else {
      var spez = META.abweichungen.filter(function (a) {
        return a.bausteine instanceof Array && a.bausteine.some(function (c) { return codes.indexOf(c) !== -1; });
      });
      var alle = META.abweichungen.filter(function (a) { return a.bausteine === "alle"; });
      abw = (spez.length ? '<ul class="kern-list kern-list--bullet" style="margin:0">' + spez.map(function (a) {
               return '<li>' + e(a.nr + " " + (sprache === "en" && a.titel_en ? a.titel_en : a.titel)) +
                 ' <span class="kt__gruppe-marke">· ' + e(artEN(a.art)) + '</span></li>';
             }).join("") + '</ul>' : e(T("abwKeineEigene"))) +
            '<p class="kt__gruppe-marke" style="margin:0.5rem 0 0">' + e(T("abwAlle", { l: alle.map(function (a) { return a.nr; }).join(", ") })) +
            ' <a class="kern-link" href="ABWEICHUNGEN.txt" hreflang="de">ABWEICHUNGEN.txt</a></p>';
    }
    return '<dl class="kern-description-list" style="margin-block:0 2rem">' +
      zeile(e(T("klasse")), codes.map(function (c) { return '<span class="kn-code">' + e(c) + '</span>'; }).join(", ")) +
      zeile(e(T("deutsch")), '<span lang="de">' + e(einmal(n.map(function (x) { return x.de; })).join(", ")) + '</span>') +
      zeile(e(T("englisch")), '<span lang="en">' + e(einmal(n.map(function (x) { return x.en; })).join(", ")) + '</span>') +
      (syn.length ? zeile(e(T("auchGenannt")), e(syn.join(", "))) : "") +
      zeile(e(T("abweichungen")), abw) + '</dl>';
  }

  function liste(werte) { return werte.map(function (s) { return "<li>" + e(s) + "</li>"; }).join(""); }

  /* --- Eine Komponentenseite ------------------------------------------ */
  /* KERNs Beispiele verweisen auf "/img/kern-img-media.png" — einen absoluten
     Pfad, der nur von einer Serverwurzel aus auflöst. Das Markup bleibt
     unverändert (Instruktion §8): aufgelöst wird erst beim Rendern, auf das
     mitgelieferte img/ dieses Pakets. Der angezeigte Quelltext bleibt KERNs
     Original. Befund B1 des Assessments vom 16.11.2026. */
  function bildPfad(h) {
    return h.replace(/(\ssrc=")\/img\//g, '$1img/');
  }

  /* Breite Tabellen auf der Bühne (25.11.2026). Die Bühne steckt in ".kt__bsp"
     mit "overflow: hidden" — eine Tabelle, die breiter ist als die Bühne, wurde
     darum ABGESCHNITTEN, ohne Bildlaufleiste und ohne Tastaturweg zu den rechten
     Spalten. Gemessen bei 320 px: sichtbar 254 px, Inhalt 511 px, die letzte
     Spalte lag außerhalb (WCAG 2.1.1; design-ui 4 verlangt für diesen Fall einen
     erreichbaren, BENANNTEN Rahmen).
     Eine Stelle für alle Beispiele, und erst beim Rendern — KERNs Markup bleibt
     unverändert (Instruktion §8), der angezeigte Quelltext zeigt weiter das
     Original. Unsere eigenen Beispiele bringen ihren Rahmen schon mit
     (kn-table-frame); die bekommen keinen zweiten.
     Tabstopp und Rolle NUR, solange es wirklich etwas zu schieben gibt
     (design-ui 4: "Passt die Tabelle, entfallen Hinweis und Tab-Stopp") —
     darum nach jedem Zeichnen und bei jeder Breitenänderung neu gemessen. */
  var rahmenGemerkt = [];

  function tabellenRahmen(buehne, name) {
    Array.prototype.forEach.call(buehne.querySelectorAll("table"), function (t) {
      if (t.closest(".kn-table-frame") || t.closest(".kt__tabelle")) return;
      var rahmen = document.createElement("div");
      rahmen.className = "kt__tabelle";
      t.parentNode.insertBefore(rahmen, t);
      rahmen.appendChild(t);
      rahmenGemerkt.push({ rahmen: rahmen, name: name });
    });
  }

  function messeRahmen() {
    rahmenGemerkt.forEach(function (r) {
      var schiebbar = r.rahmen.scrollWidth > r.rahmen.clientWidth + 1;
      if (schiebbar) {
        r.rahmen.setAttribute("tabindex", "0");
        r.rahmen.setAttribute("role", "region");
        r.rahmen.setAttribute("aria-label", T("tabelleRollbar").replace("%n", r.name));
      } else {
        r.rahmen.removeAttribute("tabindex");
        r.rahmen.removeAttribute("role");
        r.rahmen.removeAttribute("aria-label");
      }
    });
  }

  var messeBremse;
  window.addEventListener("resize", function () {
    clearTimeout(messeBremse);
    messeBremse = setTimeout(messeRahmen, 120);
  });

  function zeichneSeite() {
    var id = location.hash.slice(1) || K[0].id;
    var k = K.filter(function (x) { return x.id === id; })[0] || K[0];
    var en = EN(k), name = feld(k, "name");

    var teile = [];
    teile.push('<div class="kt__kopfzeile">' +
      '<h1 class="kern-heading-large" style="margin:0">' + e(name) + '</h1>' +
      '<span class="kt__gruppe-marke">' + e(wort("gruppe", k.gruppe)) + ' · ' + e(T("herkunft")) + ': ' +
      e(en.herkunft || wort("herkunft", k.herkunft)) + '</span></div>');
    teile.push('<p class="kern-body kt__zweck" style="margin-block:1rem 1rem">' + e(feld(k, "zweck")) + '</p>');
    teile.push(steckbrief(k));
    if (k.quelle) {
      teile.push('<p class="kern-body kern-body--small" style="margin-block:0 2rem">' + e(T("quelle")) +
        ' <a class="kern-link" href="' + e(k.quelle) + '" hreflang="de">' + e(k.quelle.replace("https://www.", "")) + '</a></p>');
    }

    /* Entscheidungshilfe — das, was der Recherche zufolge in KERN
       ganz fehlt: nicht nur WAS es gibt, sondern WANN man es nimmt. */
    var wann = feld(k, "wann"), nicht = feld(k, "nicht");
    if (wann.length || nicht.length) teile.push('<div class="kt__wann" style="margin-block-end:2.5rem">' +
      '<div class="kern-card"><div class="kern-card__container"><header class="kern-card__header">' +
      '<h2 class="kern-title">' + e(T("wann")) + '</h2></header><div class="kern-card__body"><ul class="kern-list kern-list--bullet">' +
      liste(wann) + '</ul></div></div></div>' +
      '<div class="kern-card"><div class="kern-card__container"><header class="kern-card__header">' +
      '<h2 class="kern-title">' + e(T("nicht")) + '</h2></header><div class="kern-card__body"><ul class="kern-list kern-list--bullet">' +
      liste(nicht) + '</ul></div></div></div></div>');

    /* Beispiele: live UND als Quelltext, aus demselben String. Inhalt sind
       deutsche Musterdaten — darum lang="de" an der Bühne (WCAG 3.1.2). */
    k.bsp.forEach(function (b, i) {
      var qid = "q-" + k.id + "-" + i, bEN = (en.bsp || [])[i] || {};
      teile.push('<h2 class="kern-heading-small">' + e(bEN.titel || b.titel) + '</h2>');
      if (b.hinweis) teile.push('<p class="kt__hinweis">' + e(bEN.hinweis || b.hinweis) + '</p>');
      /* F25: unsauberes Markup in KERNs Beispiel — vom Generator festgestellt (kern-katalog-bauen.py) */
      if (b.markup) {
        var befund = [];
        Object.keys(b.markup.offen || {}).forEach(function (tag) { befund.push(T("offen", { n: b.markup.offen[tag], t: tag })); });
        Object.keys(b.markup.zuviel || {}).forEach(function (tag) { befund.push(T("zuviel", { n: b.markup.zuviel[tag], t: tag })); });
        teile.push('<p class="kt__hinweis kt__hinweis--markup">' + e(T("markup", { b: befund.join(", ") })) + '</p>');
      }
      teile.push('<div class="kt__bsp" style="margin-block-end:2.5rem">' +
        '<div class="kt__bsp-kopf">' +
          '<span class="kern-body kern-body--small kern-body--muted kern-ml-auto">' + e(T("lebend")) + '</span>' +
          '<button class="kern-btn kern-btn--tertiary kern-btn--small" data-quelle="' + qid + '"' +
                 ' aria-expanded="false" aria-controls="' + qid + '"><span class="kern-label">' + e(T("qZeigen")) + '</span></button>' +
        '</div>' +
        '<div class="kt__buehne" lang="de" data-kt-bsp="' + i + '"></div>' +
        '<pre class="kt__quelle" id="' + qid + '" hidden>' + e(b.html) + '</pre>' +
      '</div>');
    });

    var barriere = feld(k, "barriere");
    if (barriere.length) teile.push('<h2 class="kern-heading-small">' + e(T("barriere")) + '</h2><ul class="kern-list kern-list--bullet">' +
      liste(barriere) + '</ul>');

    /* KERN-Bausteine: was KERN der Umsetzung überlässt — und wer es leistet. */
    if (k.pflichten && k.pflichten.length) {
      teile.push('<h2 class="kern-heading-small">' + e(T("pflichten")) + '</h2>' +
        '<p class="kt__hinweis">' + e(T("pflichtenHinweis")) + '</p>' +
        '<table class="kern-table" style="margin-block-end:2rem"><caption class="kern-sr-only">' + e(T("pflichten")) + ', ' +
        e(name) + '</caption><thead class="kern-table__head"><tr class="kern-table__row"><th class="kern-table__header">' + e(T("pflicht")) +
        '</th><th class="kern-table__header">' + e(T("stand")) + '</th><th class="kern-table__header">' + e(T("anmerkung")) +
        '</th></tr></thead><tbody class="kern-table__body">' +
        k.pflichten.map(function (z, i) {
          var p = (en.pflichten || [])[i] || [];
          return '<tr class="kern-table__row"><td class="kern-table__cell">' + e(p[0] || z[0]) + '</td><td class="kern-table__cell">' +
            e(wort("stand", z[1])) + '</td><td class="kern-table__cell">' + e(p[1] !== undefined ? p[1] : z[2]) + '</td></tr>';
        }).join("") + '</tbody></table>');
    }
    var tasten = feld(k, "tasten");
    if (tasten && tasten.length) {
      /* Tastaturvertrag (M50): Taste → Wirkung → Ansage; die dritte Spalte
         erscheint, sobald ein Eintrag sagt, was angesagt wird */
      var ansage = tasten.some(function (z) { return z[2]; });
      teile.push('<h2 class="kern-heading-small">' + e(T("tastatur")) + '</h2>' +
        '<table class="kern-table" style="margin-block-end:2rem"><caption class="kern-sr-only">' + e(T("tastatur")) + ', ' +
        e(name) + '</caption><thead class="kern-table__head"><tr class="kern-table__row"><th class="kern-table__header" scope="col">' + e(T("taste")) +
        '</th><th class="kern-table__header" scope="col">' + e(T("wirkung")) + '</th>' +
        (ansage ? '<th class="kern-table__header" scope="col">' + e(T("ansage")) + '</th>' : '') + '</tr></thead><tbody class="kern-table__body">' +
        tasten.map(function (z) {
          return '<tr class="kern-table__row"><td class="kern-table__cell">' + e(z[0]) + '</td><td class="kern-table__cell">' + e(z[1]) + '</td>' +
            (ansage ? '<td class="kern-table__cell">' + e(z[2] || "—") + '</td>' : '') + '</tr>';
        }).join("") + '</tbody></table>');
    }

    teile.push('<h2 class="kern-heading-small" style="margin-block-start:2rem">' + e(T("klassen")) + '</h2>' +
      '<table class="kern-table"><caption class="kern-sr-only">' + e(T("klassenVon", { n: name })) +
      '</caption><thead class="kern-table__head"><tr class="kern-table__row"><th class="kern-table__header">' + e(T("klasse")) +
      '</th><th class="kern-table__header">' + e(T("bedeutung")) + '</th></tr></thead><tbody class="kern-table__body">' +
      k.klassen.map(function (z, i) {
        var b = (en.klassen || [])[i] || wort("art", z[1]);
        return '<tr class="kern-table__row"><td class="kern-table__cell kn-code">' + e(z[0]) + '</td><td class="kern-table__cell">' + e(b) + '</td></tr>';
      }).join("") + '</tbody></table>');

    /* Weiterblättern — wie in echten Katalogen unten auf jeder Seite. */
    var i = K.indexOf(k);
    var vor = K[i - 1], zurueck = K[i + 1];
    teile.push('<nav class="kern-flex kern-flex-wrap kern-align-items-center kern-gap-sm" aria-label="' + e(T("weitere")) + '" ' +
      'style="margin-block-start:3rem;padding-block-start:1.5rem;' +
      'border-block-start:1px solid var(--kern-color-decorative-border-default)">' +
      (vor ? '<a class="kern-link" href="#' + vor.id + '"><span class="kern-icon kern-icon--arrow-back" aria-hidden="true"></span>' + e(feld(vor, "name")) + '</a>' : "") +
      (zurueck ? '<a class="kern-link kern-ml-auto" href="#' + zurueck.id + '">' +
                 e(feld(zurueck, "name")) + ' →</a>' : "") + '</nav>');

    seite.innerHTML = teile.join("");
    /* Beispiele einzeln einsetzen: so bleibt unsauberes Markup in seiner Fläche —
       KERNs Beispiel „Gruppe mit Hinweistext und Fehlermeldung“ (Checkboxen) schließt
       ein </div> zu viel und brach sonst aus der Fläche aus (F25, 13.10.2026). */
    rahmenGemerkt = [];
    Array.prototype.forEach.call(seite.querySelectorAll("[data-kt-bsp]"), function (buehne) {
      buehne.innerHTML = bildPfad(k.bsp[Number(buehne.getAttribute("data-kt-bsp"))].html);
      tabellenRahmen(buehne, name);
    });
    messeRahmen();
    document.title = name + " — " + T("titel");

    /* Quelltext ein- und ausblenden. */
    Array.prototype.forEach.call(seite.querySelectorAll("[data-quelle]"), function (b) {
      b.addEventListener("click", function () {
        var q = document.getElementById(b.dataset.quelle);
        var auf = !q.hidden;
        q.hidden = auf;
        b.setAttribute("aria-expanded", String(!auf));
        b.querySelector(".kern-label").textContent = T(auf ? "qZeigen" : "qVerbergen");
      });
    });

    /* Die Beispiele sind echtes Markup — also verdrahten. */
    window.KN.start();
    zeichneNav(suche.value);
  }

  /* Die Leiste oben steht fest (sticky). Damit Sprünge und Fokus innerhalb der
     Seite nicht darunter landen, rechnet der Browser ihre Höhe ein
     (scroll-padding) — gemessen, weil sie auf schmalen Bildschirmen umbricht. */
  var leiste = document.querySelector(".kt__leiste");
  function leistenhoehe() {
    document.documentElement.style.scrollPaddingBlockStart = leiste.offsetHeight + "px";
    document.documentElement.style.setProperty("--kt-leiste", leiste.offsetHeight + "px");   /* Navigation darunter */
  }
  leistenhoehe();
  if (window.ResizeObserver) new ResizeObserver(leistenhoehe).observe(leiste);

  /* Neuer Eintrag = neue Seite: oben beginnen, Fokus auf den Inhalt, ohne dass
     der Browser die Oberkante unter die Leiste schiebt. */
  window.addEventListener("hashchange", function () {
    zeichneSeite();
    window.scrollTo({ top: 0, behavior: "instant" });   /* KERN gleitet sonst (scroll-behavior: smooth) */
    seite.focus({ preventScroll: true });
  });

  suche.addEventListener("input", function () { zeichneNav(suche.value); });

  /* --- Filter in der Kopfleiste ---------------------------------------- */
  var FILTER = ["alle", "neu", "bestehend"];
  var filterMenue = document.getElementById("kt-filter");
  var filterKnopf = document.querySelector("[data-kt-filter-knopf]");
  function anzahl(f) { return K.filter(function (k) { return f === "alle" || (f === "neu") === istNeu(k); }).length; }
  FILTER.forEach(function (f) {
    document.querySelector('[data-kt-anzahl="' + f + '"]').textContent = "(" + anzahl(f) + ")";
  });
  function zeigeFilter() {
    if (FILTER.indexOf(filter) === -1) filter = "alle";
    [].forEach.call(filterMenue.querySelectorAll("[role='menuitemradio']"), function (r) {
      r.setAttribute("aria-checked", String(r.value === filter));
    });
    document.querySelector("[data-kt-filter-name]").textContent = T("filterName", { f: T("f_" + filter) });
    if (filter === "alle") filterKnopf.removeAttribute("data-kt-aktiv"); else filterKnopf.setAttribute("data-kt-aktiv", "");
    if (zahl) zahl.textContent = zahlText() + (filter === "alle" ? "" : T("gefiltert", { f: T("f_" + filter), n: anzahl(filter) }));
  }
  filterMenue.addEventListener("kn-menu-wahl", function (ev) {
    filter = ev.detail.value;
    try { localStorage.setItem("kt-filter", filter); } catch (x) {}
    zeigeFilter();
    zeichneNav(suche.value);
    window.KN.melde(T("filterAnsage", { f: T("f_" + filter), n: anzahl(filter) }));
  });

  /* --- Sprache umschalten (M84) --------------------------------------- */
  function setzeTexte() {
    document.documentElement.lang = sprache;
    [].forEach.call(document.querySelectorAll("[data-kt-text]"), function (el) {
      el.textContent = T(el.getAttribute("data-kt-text"));
    });
    [].forEach.call(document.querySelectorAll("[data-kt-attr]"), function (el) {
      el.getAttribute("data-kt-attr").split(";").forEach(function (paar) {
        var p = paar.split(":"); el.setAttribute(p[0], T(p[1]));
      });
    });
    [].forEach.call(document.querySelectorAll("[data-kt-sprache]"), function (b) {
      b.setAttribute("aria-pressed", String(b.value === sprache));
    });
    zeigeFilter();
  }
  [].forEach.call(document.querySelectorAll("[data-kt-sprache]"), function (b) {
    b.addEventListener("click", function () {
      if (b.value === sprache) return;
      sprache = b.value;
      try { localStorage.setItem("kt-sprache", sprache); } catch (x) {}
      setzeTexte();
      zeichneSeite();
      window.KN.melde(T("spracheAnsage"));
    });
  });

  setzeTexte();
  zeichneSeite();
})();
</script>
</body>
</html>
